<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recibos de Sueldo — Empleados de Comercio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --navy: #16213E;
            --navy-light: #243257;
            --paper: #F6F4EE;
            --card: #FFFFFF;
            --ink: #1D1C1A;
            --ink-soft: #5B584F;
            --teal: #0D7377;
            --teal-dark: #0A5559;
            --amber: #B7791F;
            --red: #9B2C2C;
            --line: #DAD5C6;
            --line-strong: #B9B2A0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #root {
            min-height: 100vh;
        }

        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ---------- Top bar ---------- */
        .topbar {
            background: var(--navy);
            color: #EDEBE3;
            padding: 18px 28px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            border-bottom: 3px solid var(--teal);
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .brand .mark {
            font-family: 'Source Serif 4', serif;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 0.3px;
        }

        .brand .tag {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.6px;
            color: #B9C4D6;
        }

        .topbar input[type=text] {
            background: transparent;
            border: none;
            border-bottom: 1px solid #4C5A7D;
            color: #EDEBE3;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 4px 2px;
            width: 180px;
        }

        .topbar input[type=text]:focus {
            outline: none;
            border-bottom-color: var(--teal);
        }

        .topbar .field-label {
            font-size: 10px;
            color: #8E9CB8;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 2px;
        }

        .topbar-fields {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        /* ---------- Layout ---------- */
        .layout {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: #EFEBDF;
            border-right: 1px solid var(--line-strong);
            padding: 20px 14px;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: var(--ink-soft);
            margin: 0 0 12px 4px;
        }

        .emp-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 4px;
            border: 1px solid transparent;
        }

        .emp-item:hover {
            background: #E4DFCF;
        }

        .emp-item.active {
            background: var(--card);
            border-color: var(--line-strong);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.03);
        }

        .emp-item .name {
            font-weight: 600;
            font-size: 13.5px;
        }

        .emp-item .sub {
            font-size: 11px;
            color: var(--ink-soft);
            font-family: 'JetBrains Mono', monospace;
        }

        .emp-item .del {
            opacity: 0;
            color: var(--red);
            font-size: 16px;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .emp-item:hover .del {
            opacity: 0.6;
        }

        .emp-item .del:hover {
            opacity: 1;
            background: #F4E3E3;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13px;
            border: none;
            border-radius: 3px;
            padding: 9px 16px;
            cursor: pointer;
            transition: filter .12s ease;
        }

        .btn:hover {
            filter: brightness(1.08);
        }

        .btn:active {
            filter: brightness(0.95);
        }

        .btn-primary {
            background: var(--teal);
            color: #fff;
        }

        .btn-ghost {
            background: transparent;
            color: var(--navy);
            border: 1px solid var(--line-strong);
        }

        .btn-block {
            width: 100%;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 12px;
        }

        .main {
            flex: 1;
            overflow-y: auto;
            padding: 28px 34px;
            min-width: 0;
        }

        .empty-state {
            max-width: 440px;
            margin: 60px auto;
            text-align: center;
            color: var(--ink-soft);
        }

        .empty-state .mark {
            font-family: 'Source Serif 4', serif;
            font-size: 20px;
            color: var(--ink);
            display: block;
            margin-bottom: 8px;
        }

        .tabs {
            display: flex;
            gap: 2px;
            margin-bottom: 22px;
            border-bottom: 1px solid var(--line-strong);
        }

        .tab {
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-soft);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }

        .tab.active {
            color: var(--navy);
            border-bottom-color: var(--teal);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 22px 24px;
            margin-bottom: 18px;
        }

        .card h3 {
            font-family: 'Source Serif 4', serif;
            font-size: 16px;
            margin: 0 0 16px;
            color: var(--navy);
            border-bottom: 1px dashed var(--line-strong);
            padding-bottom: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px 18px;
        }

        .field label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--ink-soft);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--line-strong);
            border-radius: 3px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13.5px;
            background: #FCFBF8;
            color: var(--ink);
        }

        .field input:focus,
        .field select:focus {
            outline: none;
            border-color: var(--teal);
            background: #fff;
        }

        .field input.no-spinner::-webkit-outer-spin-button,
        .field input.no-spinner::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .field input.no-spinner[type=number] {
            -moz-appearance: textfield;
        }

        .field.checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .field.checkbox input {
            width: auto;
        }

        .field.checkbox label {
            margin: 0;
            text-transform: none;
            font-weight: 500;
            letter-spacing: 0;
            font-size: 13px;
        }

        .field input:disabled {
            background: #EFEDE5;
            color: var(--ink-soft);
            cursor: not-allowed;
        }

        .hint {
            font-size: 11.5px;
            color: var(--ink-soft);
            margin-top: 4px;
            line-height: 1.4;
        }

        .actions-row {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .calc-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .calc-table td {
            padding: 6px 4px;
            border-bottom: 1px solid var(--line);
        }

        .calc-table td.label {
            color: var(--ink-soft);
        }

        .calc-table td.amount {
            text-align: right;
            font-weight: 600;
        }

        .calc-table tr.total td {
            border-top: 2px solid var(--navy);
            border-bottom: none;
            font-weight: 700;
            font-size: 14.5px;
            color: var(--navy);
            padding-top: 10px;
        }

        .calc-section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--teal-dark);
            font-weight: 700;
            margin: 16px 0 4px;
        }

        .calc-section-title:first-child {
            margin-top: 0;
        }

        /* ---------- Escala salarial general ---------- */
        .escala-resumen {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 2px 10px;
            margin-top: 4px;
            scrollbar-width: thin;
        }

        .escala-chip {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 132px;
            text-align: left;
            background: #FCFBF8;
            border: 1px solid var(--line-strong);
            border-radius: 4px;
            padding: 7px 10px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .escala-chip:hover {
            border-color: var(--teal);
        }

        .escala-chip .chip-cat {
            font-size: 10.5px;
            font-weight: 600;
            color: var(--ink-soft);
            white-space: nowrap;
        }

        .escala-chip .chip-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
        }

        .escala-chip.filled .chip-val {
            color: var(--teal-dark);
        }

        .escala-chip.active {
            border-color: var(--navy);
            box-shadow: inset 0 0 0 1px var(--navy);
        }

        .escala-chip.active .chip-cat {
            color: var(--navy);
        }

        .sidebar-scale-btn {
            width: 100%;
            text-align: left;
            background: transparent;
            border: 1px dashed var(--line-strong);
            border-radius: 3px;
            padding: 9px 12px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--navy);
            cursor: pointer;
            margin-bottom: 16px;
        }

        .sidebar-scale-btn:hover {
            background: #E4DFCF;
        }

        .sidebar-scale-btn.active {
            background: var(--navy);
            color: #EDEBE3;
            border-color: var(--navy);
        }

        /* ---------- Recibo preview (facsímil) ---------- */
        .recibo-wrap {
            background: #DEDACB;
            padding: 24px;
            border-radius: 4px;
        }

        .recibo {
            background: #fff;
            max-width: 760px;
            margin: 0 auto 22px;
            border: 1px solid #999;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .12);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            color: #111;
            font-weight: 700;
            position: relative;
            overflow: hidden;
        }

        .recibo .copy-tag {
            position: absolute;
            top: 10px;
            right: 14px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--teal-dark);
            border: 1px solid var(--teal-dark);
            padding: 2px 8px;
            border-radius: 2px;
        }

        .recibo-inner {
            padding: 20px 24px;
        }

        .recibo-head {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #111;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .recibo-head .razon {
            font-family: 'Source Serif 4', serif;
            font-weight: 700;
            font-size: 15px;
        }

        .recibo-head .datos-emp {
            font-size: 10.5px;
            line-height: 1.5;
            color: #333;
        }

        .recibo-head .titulo {
            text-align: right;
        }

        .recibo-head .titulo .t1 {
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .recibo-head .titulo .t2 {
            font-size: 10px;
            color: #555;
        }

        .recibo-meta {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px 14px;
            font-size: 10.5px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #999;
        }

        .recibo-meta div span {
            display: block;
            color: #777;
            font-size: 9px;
            text-transform: uppercase;
        }

        .recibo table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1px;
        }

        .recibo table th {
            text-align: left;
            font-size: 9px;
            text-transform: uppercase;
            color: #666;
            border-bottom: 1px solid #333;
            padding: 3px 4px;
        }

        .recibo table td {
            padding: 3px 4px;
            border-bottom: 1px solid #eee;
            font-size: 11px;
        }

        .recibo table td.num {
            text-align: right;
        }

        .recibo table tfoot .totales-row td {
            border-top: 2px solid #111;
            border-bottom: none;
            font-weight: 800;
            font-size: 11.5px;
            padding-top: 5px;
        }

        .recibo .section-h {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 9.5px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background: #EFEBDF;
            padding: 3px 6px;
            margin-top: 8px;
        }

        .recibo .neto-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            color: #000;
            border: 1px solid #000;
            padding: 8px 12px;
            margin-top: 1px;
            border-radius: 0;
            font-weight: bold;
        }

        .recibo .neto-row .lbl {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .recibo .neto-row .val {
            font-size: 16px;
            font-weight: 700;
        }

        .recibo .en-letras {
            font-size: 10px;
            color: #555;
            font-style: italic;
            margin-top: 4px;
        }

        .recibo .firmas {
            display: flex;
            justify-content: space-between;
            margin-top: 26px;
            padding-top: 8px;
        }

        .recibo .firma-box {
            width: 46%;
            text-align: center;
            border-top: 1px solid #333;
            padding-top: 4px;
            font-size: 9.5px;
            color: #444;
        }

        .recibo .legal {
            font-size: 8.5px;
            color: #777;
            margin-top: 14px;
            line-height: 1.5;
            border-top: 1px dashed #ccc;
            padding-top: 6px;
        }

        .perforation {
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 760px;
            margin: 0 auto;
            padding: 2px 0;
        }

        .perforation .dots {
            flex: 1;
            border-top: 2px dashed #8A8471;
        }

        .perforation .scissors {
            font-size: 13px;
            color: #8A8471;
        }

        .topline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .topline h1 {
            font-family: 'Source Serif 4', serif;
            font-size: 22px;
            margin: 0;
            color: var(--navy);
        }

        .topline .sub {
            font-size: 12.5px;
            color: var(--ink-soft);
        }

        .badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 10px;
            background: #E3EFEE;
            color: var(--teal-dark);
        }

        .toast {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--navy);
            color: #fff;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 13px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            z-index: 50;
        }

        .footer-note {
            font-size: 11px;
            color: var(--ink-soft);
            text-align: center;
            padding: 14px;
            border-top: 1px solid var(--line);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #C9C2AC;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef } = React;

        /* ===================== Utilidades ===================== */

        const fmt = (n) => {
            if (isNaN(n)) n = 0;
            return n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        const uid = () => Math.random().toString(36).slice(2, 10);

        // CUILs excluidos de los reportes agregados (planilla de netos,
        // costeo del servicio, etc.), sin importar guiones/espacios en cómo
        // estén cargados. No afecta los recibos individuales ni "todos los
        // recibos" — esos siguen incluyendo a todos los empleados.
        const CUILS_EXCLUIDOS_REPORTES = ["20374991141"];
        const soloDigitosCuil = (v) => (v || "").replace(/\D/g, "");

        const CATEGORIAS = [
            "Maestranza y Servicios",
            "Administrativo \"C\"",
            "Administrativo \"B\"",
            "Administrativo \"A\"",
            "Maestranza \"C\"",
            "Maestranza \"B\"",
            "Maestranza \"A\"",
            "Cajero",
        ];

        // Jornadas soportadas y su fracción respecto de la jornada completa
        const JORNADA_FRACCION = {
            COMPLETA: 1,
            TRES_CUARTOS: 0.75,
            MEDIA: 0.5,
        };
        const JORNADA_LABEL = {
            COMPLETA: "Jornada completa",
            TRES_CUARTOS: "Tres cuartos de jornada",
            MEDIA: "Media jornada",
        };
        // Forma corta, para espacios reducidos (ej. la línea de categoría en el PDF)
        const JORNADA_LABEL_CORTO = {
            COMPLETA: "Completa",
            TRES_CUARTOS: "3/4 jornada",
            MEDIA: "Media jornada",
        };

        // Horas mensuales "base" de cada jornada, usadas para calcular el
        // valor hora de las inasistencias (distinto del valor hora de las
        // horas extra, que siempre se calcula sobre 200 hs).
        const JORNADA_HORAS_BASE = {
            COMPLETA: 200,
            TRES_CUARTOS: 140,
            MEDIA: 100,
        };

        function fraccionJornada(jornada) {
            return JORNADA_FRACCION[jornada] !== undefined ? JORNADA_FRACCION[jornada] : 1;
        }

        function horasBaseJornada(jornada) {
            return JORNADA_HORAS_BASE[jornada] !== undefined ? JORNADA_HORAS_BASE[jornada] : 200;
        }

        function defaultEscalaGeneral() {
            const basicos = {};
            CATEGORIAS.forEach(c => { basicos[c] = ""; });
            return {
                basicos,
                noRemunerativo: "",
                noRemunerativoConcepto: "Asignación no remunerativa (paritaria)",
                contribucionesPatronalesPct: "",
            };
        }

        // Período (mes/año) y fecha de pago general, aplicado por defecto a
        // todos los empleados (igual criterio que la escala salarial
        // general): cada liquidación puntual puede desactivarlo y cargar su
        // propio período/fecha de pago.
        function defaultPeriodoGeneral() {
            return { periodo: "", periodoLabel: "", fechaPago: "", fechaPagoRaw: "" };
        }

        // Devuelve la liquidación "resuelta": si usa el período general
        // (por defecto sí), pisa periodo/periodoLabel/fechaPago/fechaPagoRaw
        // con los valores globales; si no, respeta los cargados a mano en esa
        // liquidación puntual.
        function resolverLiq(liq, periodoGeneral) {
            const usarPeriodoGeneral = liq.usarPeriodoGeneral !== false;
            if (!usarPeriodoGeneral) return liq;
            return {
                ...liq,
                periodo: periodoGeneral.periodo,
                periodoLabel: periodoGeneral.periodoLabel,
                fechaPago: periodoGeneral.fechaPago,
                fechaPagoRaw: periodoGeneral.fechaPagoRaw,
            };
        }

        // Número a letras (pesos argentinos)
        const UNIDADES = ["", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve", "diez",
            "once", "doce", "trece", "catorce", "quince", "dieciséis", "diecisiete", "dieciocho", "diecinueve", "veinte"];
        const DECENAS = ["", "", "veinte", "treinta", "cuarenta", "cincuenta", "sesenta", "setenta", "ochenta", "noventa"];
        const CENTENAS = ["", "ciento", "doscientos", "trescientos", "cuatrocientos", "quinientos", "seiscientos", "setecientos", "ochocientos", "novecientos"];

        function tresDigitos(n) {
            if (n === 0) return "";
            if (n === 100) return "cien";
            let s = "";
            const c = Math.floor(n / 100), r = n % 100;
            if (c > 0) s += CENTENAS[c] + " ";
            if (r <= 20) s += UNIDADES[r];
            else {
                const d = Math.floor(r / 10), u = r % 10;
                s += DECENAS[d] + (u > 0 ? " y " + UNIDADES[u] : "");
            }
            return s.trim();
        }

        function numeroALetras(num) {
            num = Math.round(num);
            if (num === 0) return "cero";
            let partes = [];
            const millones = Math.floor(num / 1000000);
            const miles = Math.floor((num % 1000000) / 1000);
            const resto = num % 1000;
            if (millones > 0) partes.push((millones === 1 ? "un millón" : tresDigitos(millones) + " millones"));
            if (miles > 0) partes.push((miles === 1 ? "mil" : tresDigitos(miles) + " mil"));
            if (resto > 0) partes.push(tresDigitos(resto));
            return partes.join(" ").trim();
        }

        function pesosEnLetras(monto) {
            const entero = Math.floor(monto);
            const centavos = Math.round((monto - entero) * 100);
            const letrasEntero = numeroALetras(entero);
            const cap = letrasEntero.charAt(0).toUpperCase() + letrasEntero.slice(1);
            return `${cap} con ${centavos.toString().padStart(2, '0')}/100 pesos`;
        }

        /* ===================== Cálculo de liquidación ===================== */

        function calcularAntiguedadAnios(fechaIngreso, periodo) {
            if (!fechaIngreso) return 0;
            const ingreso = new Date(fechaIngreso + "T00:00:00");
            const [anio, mes] = (periodo || "").split("-").map(x => parseInt(x, 10));
            const refFecha = (anio && mes) ? new Date(anio, mes - 1, 1) : new Date();
            let anios = refFecha.getFullYear() - ingreso.getFullYear();
            const m = refFecha.getMonth() - ingreso.getMonth();
            if (m < 0) anios--;
            return Math.max(0, anios);
        }

        function calcularLiquidacion(emp, liq, escalaGeneral) {
            escalaGeneral = escalaGeneral || defaultEscalaGeneral();
            const jornada = emp.jornada || "COMPLETA";
            const fraccion = fraccionJornada(jornada);

            // Básico y no remunerativo: por defecto se toman de la escala salarial
            // general (según categoría) ajustados por la jornada del empleado.
            // Si la liquidación puntual desactiva la escala general, se usan los
            // valores cargados a mano para ese período.
            const usarEscala = liq.usarEscalaGeneral !== false;

            const basicoEscalaCategoria = parseFloat((escalaGeneral.basicos || {})[emp.categoria]) || 0;
            const basicoEscala = basicoEscalaCategoria * fraccion;
            const noRemEscala = (parseFloat(escalaGeneral.noRemunerativo) || 0) * fraccion;

            const basico = usarEscala ? basicoEscala : (parseFloat(liq.basico) || 0);
            const noRemunerativoBase = usarEscala ? noRemEscala : (parseFloat(liq.noRemunerativos) || 0);

            const aniosAntig = calcularAntiguedadAnios(emp.fechaIngreso, liq.periodo);
            const antigPct = Math.min(
                aniosAntig * (parseFloat(liq.antigPctPorAnio) || 1),
                35
            );
            const antigMonto = basico * antigPct / 100;

            const valorHora = basico > 0 ? basico / 200 : 0;
            const he50 = (parseFloat(liq.horasExtra50) || 0) * valorHora * 1.5;
            const he100 = (parseFloat(liq.horasExtra100) || 0) * valorHora * 2;

            // Inasistencias: se cargan en cantidad de horas y se descuentan del
            // básico. El valor hora de la inasistencia se calcula sobre las
            // horas mensuales "base" de la jornada del empleado (200 hs jornada
            // completa, 140 hs tres cuartos, 100 hs media jornada), a diferencia
            // del valor hora de las horas extra (que siempre usa 200).
            const horasBaseInasistencia = horasBaseJornada(jornada);
            const baseInasistencia = basico + antigMonto;

            const valorHoraInasistencia =
                baseInasistencia > 0
                    ? baseInasistencia / horasBaseInasistencia
                    : 0;

            const horasInasistencia = parseFloat(liq.horasInasistencia) || 0;

            const inasistenciasMonto =
                horasInasistencia * valorHoraInasistencia;

            // Plus vacacional (Art. 155 LCT): se carga solo la cantidad de días
            // de vacaciones y el monto se calcula solo, igual que las horas
            // extra (básico ÷ 25 × días), sin necesidad de tipear el importe.
            const valorDiaVacaciones = basico > 0 ? basico / 25 : 0;
            const valorDia = basico > 0 ? basico / 30 : 0;
            const diasVacaciones = parseFloat(liq.diasVacaciones) || 0;
            const plusVacacional = diasVacaciones * valorDiaVacaciones - valorDia * diasVacaciones;

            const otrosRemun = parseFloat(liq.otrosRemunerativos) || 0;

            const brutoParaPresentismo = basico + antigMonto + he50 + he100 + plusVacacional + otrosRemun - inasistenciasMonto;
            const presentismoMonto = liq.presentismo ? brutoParaPresentismo * 0.0833 : 0;

            const totalRemunerativo = brutoParaPresentismo + presentismoMonto;

            // El concepto no remunerativo también genera antigüedad y presentismo
            // (mismos porcentajes que sobre el básico), pero lo generado sigue
            // siendo no remunerativo: no entra a totalRemunerativo, por lo que no
            // afecta jubilación ni Ley 19.032. Solo impacta las deducciones que ya
            // afectaba el no remunerativo (obra social y cuota sindical), vía
            // baseAportes más abajo.
            const antigNoRemunMonto = noRemunerativoBase * antigPct / 100;
            const brutoNoRemunParaPresentismo = noRemunerativoBase + antigNoRemunMonto;
            const presentismoNoRemunMonto = liq.presentismo ? brutoNoRemunParaPresentismo * 0.0833 : 0;

            const noRemunerativo = brutoNoRemunParaPresentismo + presentismoNoRemunMonto;

            // Base imponible para la obra social

            const baseAportes = totalRemunerativo + noRemunerativo;

            // Aporte del 3%
            const jubilacion = totalRemunerativo * 0.11;
            const ley19032 = totalRemunerativo * 0.03;

            // Los trabajadores a jornada reducida aportan a la obra social sobre
            // una base ficta equivalente a la jornada completa (se "infla" la base
            // en proporción inversa a la fracción de jornada trabajada).
            const factorJornada = fraccion > 0 ? (1 / fraccion) : 1;
            const baseCalculoOS = baseAportes * factorJornada;

            const obraSocial = baseCalculoOS * 0.03;

            // Solo para informar en el recibo

            const sindical = emp.afiliadoSindicato ? baseAportes * 0.045 : 0;
            const otrasDeducciones = parseFloat(liq.otrasDeducciones) || 0;

            const totalDeducciones = jubilacion + ley19032 + obraSocial + sindical + otrasDeducciones;

            const totalBruto = totalRemunerativo + noRemunerativo;
            const neto = totalBruto - totalDeducciones;

            // Contribuciones a cargo del empleador — puramente informativas, NO
            // se descuentan del neto del empleado. Se calculan sobre la
            // remuneración real (sin el "regrosamiento" por jornada reducida que
            // sí aplica al aporte mínimo de obra social). La alícuota es la que
            // el usuario cargue en la Escala salarial general, según su régimen
            // vigente (Decreto 814/2001, ART, etc.).
            const contribPatronalesPct = parseFloat(escalaGeneral.contribucionesPatronalesPct) || 0;
            const contribucionesPatronales = (totalRemunerativo + noRemunerativo) * contribPatronalesPct / 100;

            return {
                jornada, fraccion, usarEscala, basico, basicoEscala, noRemEscala,
                aniosAntig, antigPct, antigMonto, valorHora, he50, he100,
                horasBaseInasistencia, valorHoraInasistencia, horasInasistencia, inasistenciasMonto,
                valorDiaVacaciones, diasVacaciones, plusVacacional, otrosRemun,
                presentismoMonto, totalRemunerativo,
                noRemunerativoBase, antigNoRemunMonto, presentismoNoRemunMonto, noRemunerativo,
                jubilacion, ley19032, obraSocial, sindical, otrasDeducciones, totalDeducciones,
                totalBruto, neto, contribPatronalesPct, contribucionesPatronales
            };
        }

        /* ===================== Cálculo de Aguinaldo (S.A.C.) ===================== */

        // El S.A.C. equivale al 50% de la mejor remuneración mensual del semestre
        // (Ley 23.041). Se toma como base la liquidación actualmente cargada
        // (remunerativo + no remunerativo), con opción de excluir las horas extra
        // de esa base ya que suelen no ser "habituales". Las deducciones se
        // calculan con el mismo criterio que en el sueldo: jubilación y Ley
        // 19.032 solo sobre la porción remunerativa, obra social y sindical sobre
        // el total (con el mismo ajuste por jornada reducida).
        function calcularAguinaldo(emp, calc, incluirHorasExtra) {
            // El plus vacacional se excluye siempre de la base del aguinaldo: no
            // es una remuneración habitual del mes sino un concepto puntual
            // ligado a los días de vacaciones tomados en ese período.
            const remunerativoBase = (incluirHorasExtra
                ? calc.totalRemunerativo
                : calc.totalRemunerativo - calc.he50 - calc.he100) - (calc.plusVacacional || 0);
            const noRemunerativoBase = calc.noRemunerativo;
            const baseTotal = remunerativoBase + noRemunerativoBase;

            const sacRemun = remunerativoBase * 0.5;
            const sacNoRemun = noRemunerativoBase * 0.5;
            const sacBruto = sacRemun + sacNoRemun;

            const jubilacion = sacRemun * 0.11;
            const ley19032 = sacRemun * 0.03;
            const baseAportes = sacRemun + sacNoRemun;
            const factorJornada = calc.fraccion > 0 ? (1 / calc.fraccion) : 1;
            const obraSocial = baseAportes * factorJornada * 0.03;
            const sindical = emp.afiliadoSindicato ? baseAportes * 0.045 : 0;
            const totalDeducciones = jubilacion + ley19032 + obraSocial + sindical;
            const neto = sacBruto - totalDeducciones;

            // Contribuciones patronales sobre el aguinaldo (mismo criterio que en
            // el sueldo: informativo, no descuenta del neto, sin el regrosamiento
            // por jornada reducida).
            const contribPatronalesPct = calc.contribPatronalesPct || 0;
            const contribucionesPatronales = baseAportes * contribPatronalesPct / 100;

            return {
                incluirHorasExtra, remunerativoBase, noRemunerativoBase, baseTotal,
                sacRemun, sacNoRemun, sacBruto,
                jubilacion, ley19032, obraSocial, sindical, totalDeducciones, neto,
                contribPatronalesPct, contribucionesPatronales
            };
        }

        /* ===================== Payload para Webhook (Make → Google Sheets) ===================== */

        function construirPayloadEmpleado(empresa, emp, liq, calc) {
            const n = (v) => Number((v || 0).toFixed(2));
            return {
                fecha_envio: new Date().toISOString(),
                empresa_razonSocial: empresa.razonSocial || "",
                empresa_cuit: empresa.cuit || "",
                empleado_nombre: emp.nombre || "",
                empleado_cuil: emp.cuil || "",
                empleado_legajo: emp.legajo || "",
                categoria: emp.categoria || "",
                jornada: JORNADA_LABEL[calc.jornada] || "",
                fecha_ingreso: emp.fechaIngreso || "",
                periodo: liq.periodoLabel || liq.periodo || "",
                fecha_pago: liq.fechaPago || "",
                basico: n(calc.basico),
                antiguedad_pct: n(calc.antigPct),
                antiguedad_monto: n(calc.antigMonto),
                presentismo_monto: n(calc.presentismoMonto),
                horas_extra_50: n(calc.he50),
                horas_extra_100: n(calc.he100),
                horas_inasistencia: n(calc.horasInasistencia),
                inasistencias_monto: n(calc.inasistenciasMonto),
                plus_vacacional_dias: n(calc.diasVacaciones),
                plus_vacacional_monto: n(calc.plusVacacional),
                otras_remuneraciones_concepto: liq.otrosRemunerativosConcepto || "",
                otras_remuneraciones_monto: n(calc.otrosRemun),
                no_remunerativo_concepto: liq.noRemunerativosConcepto || "",
                no_remunerativo_base: n(calc.noRemunerativoBase),
                no_remunerativo_antiguedad: n(calc.antigNoRemunMonto),
                no_remunerativo_presentismo: n(calc.presentismoNoRemunMonto),
                no_remunerativo_total: n(calc.noRemunerativo),
                jubilacion: n(calc.jubilacion),
                ley_19032: n(calc.ley19032),
                obra_social: n(calc.obraSocial),
                cuota_sindical: n(calc.sindical),
                otras_deducciones_concepto: liq.otrasDeduccionesConcepto || "",
                otras_deducciones_monto: n(calc.otrasDeducciones),
                total_remunerativo: n(calc.totalRemunerativo),
                total_deducciones: n(calc.totalDeducciones),
                total_bruto: n(calc.totalBruto),
                neto_a_cobrar: n(calc.neto),
                contribuciones_patronales_pct: n(calc.contribPatronalesPct),
                contribuciones_patronales_monto: n(calc.contribucionesPatronales),
            };
        }

        async function enviarWebhook(url, payload) {
            try {
                const resp = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                return { ok: resp.ok, detalle: `HTTP ${resp.status}` };
            } catch (err) {
                return { ok: false, detalle: (err && err.message) ? err.message : "Error de red / CORS" };
            }
        }

        /* ===================== Generación de PDF ===================== */

        // Dibuja la página de un recibo (bloque ORIGINAL + DUPLICADO) en la
        // página actual del documento `doc`. Se usa tanto para emitir el PDF de
        // un solo empleado como para armar el PDF con todos los recibos juntos.
        function dibujarPaginaRecibo(doc, empresa, emp, liq, calc) {
            const W = 210;
            // Se quitó el texto legal que iba suelto al pie de la hoja (fuera de
            // los recibos) para poder estirar cada bloque y dar más aire a la firma.
            const BLOCK_H = 136;
            const TOP_MARGIN = 8;
            const GAP = 10;
            const y1 = TOP_MARGIN;
            const y2 = y1 + BLOCK_H + GAP;

            function bloque(y, tag) {
                const left = 14, right = W - 14;
                const bottom = y + BLOCK_H;
                doc.setDrawColor(20, 20, 20);
                doc.setLineWidth(0.4);
                doc.rect(left, y, right - left, BLOCK_H);

                // Header
                doc.setFont("times", "bold"); doc.setFontSize(12);
                doc.text(empresa.razonSocial || "[Razón Social]", left + 4, y + 8);
                doc.setFont("helvetica", "normal"); doc.setFontSize(8);
                doc.text(`CUIT: ${empresa.cuit || "-"}   Domicilio: ${empresa.domicilio || "-"}`, left + 4, y + 13);
                doc.text(`Actividad: ${empresa.actividad || "Comercio"}`, left + 4, y + 17);

                doc.setFont("helvetica", "bold"); doc.setFontSize(10);
                doc.text("RECIBO DE HABERES", right - 4, y + 8, { align: "right" });
                doc.setFont("helvetica", "normal"); doc.setFontSize(8);
                doc.text("CCT 130/75 — Empleados de Comercio", right - 4, y + 12, { align: "right" });
                doc.setDrawColor(13, 115, 119); doc.setLineWidth(0.6);
                doc.rect(right - 24, y + 15, 20, 5.5);
                doc.setFont("helvetica", "bold"); doc.setFontSize(7.5);
                doc.text(tag, right - 14, y + 19, { align: "center" });

                doc.setDrawColor(20, 20, 20); doc.setLineWidth(0.2);
                doc.line(left, y + 21, right, y + 21);

                // Datos empleado — 3 columnas (nombre/período/legajo,
                // cuil/fecha pago/antigüedad, categoría/fecha ingreso) para
                // liberar espacio vertical cuando hay muchos conceptos.
                doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
                let ly = y + 27;
                const col1 = left + 4, col2 = left + 90, col3 = left + 148;
                doc.text(`Apellido y Nombre: ${emp.nombre || "-"}`, col1, ly);
                doc.text(`Período: ${liq.periodoLabel || "-"}`, col2, ly);
                doc.text(`Legajo: ${emp.legajo || "-"}`, col3, ly);
                ly += 5;
                doc.text(`CUIL: ${emp.cuil || "-"}`, col1, ly);
                doc.text(`Fecha de pago: ${liq.fechaPago || "-"}`, col2, ly);
                doc.text(`Antig.: ${calc.aniosAntig} año(s)`, col3, ly);
                ly += 5;
                doc.text(`Categoría: ${emp.categoria || "-"} · ${JORNADA_LABEL_CORTO[calc.jornada] || "-"}`, col1, ly);
                doc.text(`Fecha de ingreso: ${emp.fechaIngreso || "-"}`, col2, ly);

                ly += 4;
                doc.line(left, ly, right, ly);
                ly += 5;

                // Tabla única: Concepto | Remunerativo | No remunerativo | Deducción
                const xRemun = left + 120;
                const xNoRemun = left + 152;
                const xDeduc = right - 4;

                doc.setFont("helvetica", "bold"); doc.setFontSize(7);
                doc.text("CONCEPTO", col1, ly);
                doc.text("REMUNERATIVO", xRemun, ly, { align: "right" });
                doc.text("NO REMUNER.", xNoRemun, ly, { align: "right" });
                doc.text("DEDUCCIÓN", xDeduc, ly, { align: "right" });
                ly += 2;
                doc.setDrawColor(20, 20, 20); doc.setLineWidth(0.2);
                doc.line(col1, ly, xDeduc, ly);
                ly += 3.5;

                // Armamos primero la lista de conceptos con importe (filtrando
                // los que están en cero) para saber cuántas filas va a tener la
                // tabla, y así elegir la altura de fila y el tamaño de letra:
                // con muchos conceptos cargados (horas extra + plus vacacional +
                // otros) el recibo se compacta solo para que todo siga entrando
                // dentro del bloque, sin tapar los totales ni el neto.
                const conceptosTabla = [
                    ["Sueldo básico", calc.basico, 0, 0],
                    ["Antigüedad", calc.antigMonto, 0, 0],
                    ["Presentismo", calc.presentismoMonto, 0, 0],
                    ["Horas extra", (calc.he50 || 0) + (calc.he100 || 0), 0, 0],
                    [`Inasistencias (${calc.horasInasistencia || 0} hs)`, -(calc.inasistenciasMonto || 0), 0, 0],
                    [`Plus vacacional (${calc.diasVacaciones || 0} día/s)`, calc.plusVacacional, 0, 0],
                    [liq.otrosRemunerativosConcepto || "Otras remuneraciones", calc.otrosRemun, 0, 0],
                    [liq.noRemunerativosConcepto || "Asignación no remunerativa", 0, calc.noRemunerativoBase, 0],
                    ["Antigüedad s/no remunerativo", 0, calc.antigNoRemunMonto, 0],
                    ["Presentismo s/no remunerativo", 0, calc.presentismoNoRemunMonto, 0],
                    ["Jubilación (Ley 24.241) 11%", 0, 0, calc.jubilacion],
                    ["Ley 19.032 (INSSJP/PAMI) 3%", 0, 0, calc.ley19032],
                    ["Obra social 3%", 0, 0, calc.obraSocial],
                    ["Cuota sindical FAECyS 4,5%", 0, 0, calc.sindical],
                    [liq.otrasDeduccionesConcepto || "Otras deducciones", 0, 0, calc.otrasDeducciones],
                ].filter(([, r, n, d]) => Math.abs(r || 0) >= 0.005 || Math.abs(n || 0) >= 0.005 || Math.abs(d || 0) >= 0.005);

                const filasCount = conceptosTabla.length;
                const conceptRowH = filasCount <= 9 ? 4.3 : filasCount <= 11 ? 3.9 : filasCount <= 13 ? 3.6 : 3.2;
                const conceptFontSize = filasCount <= 9 ? 7.3 : filasCount <= 11 ? 7 : filasCount <= 13 ? 6.6 : 6.2;

                doc.setFont("helvetica", "normal"); doc.setFontSize(conceptFontSize);
                const filaTabla = (concepto, remun, norem, deduc) => {
                    const r = remun || 0, n = norem || 0, d = deduc || 0;
                    doc.text(concepto, col1, ly);
                    if (Math.abs(r) >= 0.005) doc.text("$ " + fmt(r), xRemun, ly, { align: "right" });
                    if (Math.abs(n) >= 0.005) doc.text("$ " + fmt(n), xNoRemun, ly, { align: "right" });
                    if (Math.abs(d) >= 0.005) doc.text("$ " + fmt(d), xDeduc, ly, { align: "right" });
                    ly += conceptRowH;
                };

                conceptosTabla.forEach(([concepto, remun, norem, deduc]) => filaTabla(concepto, remun, norem, deduc));

                doc.setDrawColor(20, 20, 20); doc.setLineWidth(0.2);
                doc.line(col1, ly - 1.5, xDeduc, ly - 1.5);
                // -------------------- TOTALES --------------------
                ly += 2;

                doc.setFont("helvetica", "bold");
                doc.setFontSize(7.5);

                doc.text("TOTALES", col1, ly);
                doc.text("$ " + fmt(calc.totalRemunerativo), xRemun, ly, { align: "right" });
                doc.text("$ " + fmt(calc.noRemunerativo), xNoRemun, ly, { align: "right" });
                doc.text("$ " + fmt(calc.totalDeducciones), xDeduc, ly, { align: "right" });


                // -------------------- NETO (posición flexible) --------------------
                // Cuando hay pocos conceptos, el bloque de neto se ubica pegado a
                // los totales, aprovechando el espacio libre hacia abajo. Cuando
                // hay muchos conceptos (horas extra, plus vacacional, etc.) y la
                // tabla se extiende, el bloque se corre hacia arriba lo justo
                // para que siga entrando todo (son, contribuciones, texto legal
                // y firma) sin desbordar el recuadro del recibo.
                const netoMinY = ly + 3;
                const netoMaxY = bottom - (calc.contribucionesPatronales > 0 ? 30 : 26);
                const netoY = Math.min(netoMinY, netoMaxY);

                doc.setDrawColor(20, 20, 20);
                doc.rect(left, netoY, right - left, 8);

                doc.setFont("helvetica", "bold");
                doc.setFontSize(9.5);

                doc.text("NETO A COBRAR", left + 4, netoY + 5.5);
                doc.text("$ " + fmt(calc.neto), right - 4, netoY + 5.5, { align: "right" });


                // -------------------- SON --------------------
                doc.setFont("helvetica", "italic");
                doc.setFontSize(7);

                doc.text("Son: " + pesosEnLetras(calc.neto), left + 4, netoY + 11.5);


                // -------------------- CONTRIBUCIONES --------------------
                let legalOffsetY = 15.5;
                if (calc.contribucionesPatronales > 0) {

                    doc.setFont("helvetica", "italic");
                    doc.setFontSize(6.3);
                    doc.setTextColor(120, 120, 120);

                    doc.text(
                        `Contribuciones patronales a cargo del empleador (informativo): $ ${fmt(calc.contribucionesPatronales)}`,
                        left + 4,
                        netoY + 15
                    );

                    doc.setTextColor(20, 20, 20);
                    legalOffsetY = 18.5;
                }


                // -------------------- TEXTO LEGAL --------------------
                doc.setFont("helvetica", "normal");
                doc.setFontSize(6.3);
                doc.setTextColor(120, 120, 120);

                const legalTexto =
                    "Art. 138, 139 y 140 - Ley de Contrato de Trabajo Nº 20.744. Este comprobante detalla la totalidad de las remuneraciones y descuentos correspondientes al período indicado.";

                const legalLineas = doc.splitTextToSize(
                    legalTexto,
                    ((right - left) / 2) - 4
                );

                doc.text(legalLineas, left + 4, netoY + legalOffsetY);

                doc.setTextColor(20, 20, 20);

                // firmas — siempre ancladas al pie del bloque
                doc.setDrawColor(20, 20, 20); doc.setLineWidth(0.2);
                doc.setFont("helvetica", "normal");
                doc.setFontSize(6.5);

                if (tag === "ORIGINAL") {
                    // Solo firma del empleador
                    doc.line(right - 70, y + BLOCK_H - 4, right - 4, y + BLOCK_H - 4);
                    doc.text("Firma y aclaración del empleador", right - 37, y + BLOCK_H - 1.5, { align: "center" });
                } else {
                    // Solo firma del empleado
                    doc.line(right - 70, y + BLOCK_H - 4, right - 4, y + BLOCK_H - 4);
                    doc.text("Recibí conforme — Firma del empleado", right - 37, y + BLOCK_H - 1.5, { align: "center" });
                }
            }

            bloque(y1, "ORIGINAL");
            doc.setLineDashPattern([1.2, 1.2], 0);
            doc.setDrawColor(140, 132, 113);

            doc.setLineDashPattern([], 0);

        }

        // Dibuja la página de un recibo de S.A.C. (aguinaldo), con el mismo
        // esquema de bloque ORIGINAL + DUPLICADO que el recibo de sueldo.
        function dibujarPaginaAguinaldo(doc, empresa, emp, liq, calc, aguinaldo) {
            const W = 210;
            const BLOCK_H = 136;
            const TOP_MARGIN = 8;
            const GAP = 10;
            const y1 = TOP_MARGIN;
            const y2 = y1 + BLOCK_H + GAP;

            const [anioP, mesP] = (liq.periodo || "").split("-").map(x => parseInt(x, 10));
            const semestreLabel = mesP ? `${mesP <= 6 ? "1°" : "2°"} semestre ${anioP}` : "-";

            function bloque(y, tag) {
                const left = 14, right = W - 14;
                const bottom = y + BLOCK_H;
                doc.setDrawColor(20, 20, 20);
                doc.setLineWidth(0.4);
                doc.rect(left, y, right - left, BLOCK_H);

                doc.setFont("times", "bold"); doc.setFontSize(12);
                doc.text(empresa.razonSocial || "[Razón Social]", left + 4, y + 8);
                doc.setFont("helvetica", "normal"); doc.setFontSize(8);
                doc.text(`CUIT: ${empresa.cuit || "-"}   Domicilio: ${empresa.domicilio || "-"}`, left + 4, y + 13);
                doc.text(`Actividad: ${empresa.actividad || "Comercio"}`, left + 4, y + 17);

                doc.setFont("helvetica", "bold"); doc.setFontSize(10);
                doc.text("RECIBO DE S.A.C. (AGUINALDO)", right - 4, y + 8, { align: "right" });
                doc.setFont("helvetica", "normal"); doc.setFontSize(8);
                doc.text("Ley 23.041 — Art. 121/123 LCT", right - 4, y + 12, { align: "right" });
                doc.setDrawColor(13, 115, 119); doc.setLineWidth(0.6);
                doc.rect(right - 24, y + 15, 20, 5.5);
                doc.setFont("helvetica", "bold"); doc.setFontSize(7.5);
                doc.text(tag, right - 14, y + 19, { align: "center" });

                doc.setDrawColor(20, 20, 20); doc.setLineWidth(0.2);
                doc.line(left, y + 21, right, y + 21);

                doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
                let ly = y + 27;
                const col1 = left + 4, col2 = left + 95;
                doc.text(`Apellido y Nombre: ${emp.nombre || "-"}`, col1, ly);
                doc.text(`Semestre: ${semestreLabel}`, col2, ly);
                ly += 5;
                doc.text(`CUIL: ${emp.cuil || "-"}`, col1, ly);
                doc.text(`Fecha de pago: ${liq.fechaPago || "-"}`, col2, ly);
                ly += 5;
                doc.text(`Legajo: ${emp.legajo || "-"}`, col1, ly);
                doc.text(`Fecha de ingreso: ${emp.fechaIngreso || "-"}`, col2, ly);
                ly += 5;
                doc.text(`Categoría: ${emp.categoria || "-"} · ${JORNADA_LABEL_CORTO[calc.jornada] || "-"}`, col1, ly);
                doc.text(`Base tomada: ${liq.periodoLabel || liq.periodo || "-"}`, col2, ly);

                ly += 4;
                doc.line(left, ly, right, ly);
                ly += 5;

                const xRemun = left + 120;
                const xNoRemun = left + 152;
                const xDeduc = right - 4;

                doc.setFont("helvetica", "bold"); doc.setFontSize(7);
                doc.text("CONCEPTO", col1, ly);
                doc.text("REMUNERATIVO", xRemun, ly, { align: "right" });
                doc.text("NO REMUNER.", xNoRemun, ly, { align: "right" });
                doc.text("DEDUCCIÓN", xDeduc, ly, { align: "right" });
                ly += 2;
                doc.setDrawColor(20, 20, 20); doc.setLineWidth(0.2);
                doc.line(col1, ly, xDeduc, ly);
                ly += 3.5;

                doc.setFont("helvetica", "normal"); doc.setFontSize(7.5);
                const filaTabla = (concepto, remun, norem, deduc) => {
                    const r = remun || 0, n = norem || 0, d = deduc || 0;
                    if (Math.abs(r) < 0.005 && Math.abs(n) < 0.005 && Math.abs(d) < 0.005) return;
                    doc.text(concepto, col1, ly);
                    if (Math.abs(r) >= 0.005) doc.text("$ " + fmt(r), xRemun, ly, { align: "right" });
                    if (Math.abs(n) >= 0.005) doc.text("$ " + fmt(n), xNoRemun, ly, { align: "right" });
                    if (Math.abs(d) >= 0.005) doc.text("$ " + fmt(d), xDeduc, ly, { align: "right" });
                    ly += 4.3;
                };

                filaTabla("S.A.C.", aguinaldo.sacRemun, 0, 0);
                filaTabla("S.A.C. s/no remunerativo", 0, aguinaldo.sacNoRemun, 0);
                filaTabla("Jubilación (Ley 24.241) 11%", 0, 0, aguinaldo.jubilacion);
                filaTabla("Ley 19.032 (INSSJP/PAMI) 3%", 0, 0, aguinaldo.ley19032);
                filaTabla("Obra social 3%", 0, 0, aguinaldo.obraSocial);
                filaTabla("Cuota sindical FAECyS 4,5%", 0, 0, aguinaldo.sindical);

                doc.setDrawColor(20, 20, 20); doc.setLineWidth(0.2);
                doc.line(col1, ly - 1.5, xDeduc, ly - 1.5);
                ly += 1;
                doc.setFont("helvetica", "bold"); doc.setFontSize(7.5);
                doc.text("TOTALES", col1, ly);
                doc.text("$ " + fmt(aguinaldo.sacRemun), xRemun, ly, { align: "right" });
                doc.text("$ " + fmt(aguinaldo.sacNoRemun), xNoRemun, ly, { align: "right" });
                doc.text("$ " + fmt(aguinaldo.totalDeducciones), xDeduc, ly, { align: "right" });
                ly += 5.5;

                const netoMinY = ly;
                const netoMaxY = bottom - (aguinaldo.contribucionesPatronales > 0 ? 32 : 28);
                const netoY = Math.min(netoMinY, netoMaxY);

                doc.setDrawColor(20, 20, 20);
                doc.rect(left, netoY, right - left, 8);
                doc.setTextColor(0, 0, 0);
                doc.setFont("helvetica", "bold"); doc.setFontSize(9.5);
                doc.text("NETO A COBRAR", left + 4, netoY + 5.5);
                doc.text("$ " + fmt(aguinaldo.neto), right - 4, netoY + 5.5, { align: "right" });
                doc.setTextColor(20, 20, 20);
                doc.setFont("helvetica", "italic"); doc.setFontSize(7);
                doc.text("Son: " + pesosEnLetras(aguinaldo.neto), left + 4, netoY + 11.5);

                // Contribuciones patronales — entre "Son:" y el texto legal
                let legalOffsetY = 15.5;
                if (aguinaldo.contribucionesPatronales > 0) {
                    doc.setFont("helvetica", "italic"); doc.setFontSize(6.3);
                    doc.setTextColor(120, 120, 120);
                    doc.text(`Contribuciones patronales a cargo del empleador (${aguinaldo.contribPatronalesPct}%, informativo): $ ${fmt(aguinaldo.contribucionesPatronales)}`, left + 4, netoY + 15);
                    doc.setTextColor(20, 20, 20);
                    legalOffsetY = 18.5;
                }

                doc.setFont("helvetica", "normal"); doc.setFontSize(6.3);
                doc.setTextColor(120, 120, 120);
                const legalTexto = "Art. 121, 122 y 123 - Ley de Contrato de Trabajo N\u00b0 20.744 y Ley 23.041. El S.A.C. equivale al 50% de la mayor remuneraci\u00f3n mensual devengada en el semestre. " +
                    (aguinaldo.incluirHorasExtra ? "La base incluye horas extra." : "La base no incluye horas extra.");
                const legalLineas = doc.splitTextToSize(legalTexto, ((right - left) / 2) - 4);
                doc.text(legalLineas, left + 4, netoY + legalOffsetY);
                doc.setTextColor(20, 20, 20);

                doc.setDrawColor(20, 20, 20); doc.setLineWidth(0.2);
                doc.setFont("helvetica", "normal");
                doc.setFontSize(6.5);

                if (tag === "ORIGINAL") {
                    doc.line(right - 70, y + BLOCK_H - 4, right - 4, y + BLOCK_H - 4);
                    doc.text("Firma y aclaración del empleador", right - 37, y + BLOCK_H - 1.5, { align: "center" });
                } else {
                    doc.line(right - 70, y + BLOCK_H - 4, right - 4, y + BLOCK_H - 4);
                    doc.text("Recibí conforme — Firma del empleado", right - 37, y + BLOCK_H - 1.5, { align: "center" });
                }
            }

            bloque(y1, "ORIGINAL");
            doc.setLineDashPattern([1.2, 1.2], 0);
            doc.setDrawColor(140, 132, 113);
            doc.line(14, y1 + BLOCK_H + GAP / 2, W - 14, y1 + BLOCK_H + GAP / 2);
            doc.setLineDashPattern([], 0);
            bloque(y2, "DUPLICADO");
        }

        // PDF resumen simple: una tabla con columna "Empleado" y columna

        // transferirle a cada persona sin abrir cada recibo.
        function generarPDFPlanillaNetos(empresa, empleadosConLiq, escalaGeneral) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: "mm", format: "a4" });

            const left = 20, right = 190;
            const rowH = 8;
            const topMargin = 20;
            const bottomMargin = 20;
            let periodoRef = "";

            const filas = empleadosConLiq.map(({ emp, liq }) => {
                const calc = calcularLiquidacion(emp, liq, escalaGeneral);
                if (!periodoRef) periodoRef = liq.periodoLabel || liq.periodo || "";
                return { nombre: emp.nombre || "(sin nombre)", neto: calc.neto };
            });
            const totalNeto = filas.reduce((acc, f) => acc + (f.neto || 0), 0);

            let ly = topMargin;

            function dibujarEncabezado() {
                doc.setFont("times", "bold"); doc.setFontSize(14);

                doc.setFont("helvetica", "normal"); doc.setFontSize(9);
                doc.setTextColor(90, 90, 90);
                doc.text(`CUIT: ${empresa.cuit || "-"}`, left, ly);

                doc.setFont("helvetica", "bold"); doc.setFontSize(11);
                doc.setTextColor(20, 20, 20);
                doc.text(`Planilla de netos a cobrar${periodoRef ? " — " + periodoRef : ""}`, left, ly);

                doc.setFont("helvetica", "bold"); doc.setFontSize(9);
                doc.text("EMPLEADO", left, ly);
                doc.text("NETO A COBRAR", right, ly, { align: "right" });
                ly += 2;
                doc.line(left, ly, right, ly);
                ly += 6;
                doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
            }

            dibujarEncabezado();

            filas.forEach((f, idx) => {
                if (ly > 297 - bottomMargin) {
                    doc.addPage();
                    ly = topMargin;
                    dibujarEncabezado();
                }
                if (idx % 2 === 1) {
                    doc.setFillColor(245, 244, 238);
                    doc.rect(left - 2, ly - 5.5, (right - left) + 4, rowH, "F");
                }
                doc.setTextColor(20, 20, 20);
                doc.text(f.nombre, left, ly);
                doc.text("$ " + fmt(f.neto), right, ly, { align: "right" });

            doc.text("$ " + fmt(totalNeto), right, ly, { align: "right" });

        // PDF de costeo del servicio: por cada empleado informa el neto a
        // cobrar, el total de aportes + contribuciones patronales (la parte
        // de seguridad social, calculada como si el empleado trabajase
        // jornada completa —100 hs— sin importar su situación de revista
        // real), la cuota sindical por separado y el proporcional mensual
        // de aguinaldo. Al pie suma todo, aplica una utilidad del 10% y
        // sobre ese total calcula el 21% de impuestos, hasta el total a
        // facturar.
        //
        // Criterios aplicados (quedan también aclarados al pie del PDF):
        // - Aportes (jubilación 11% + Ley 19.032 3% + obra social 3%) y
        //   contribuciones patronales: recalculados sobre una base de
        //   jornada completa (100 hs) para cada empleado, independientemente
        //   de si su jornada real es completa, 3/4 o media.
        // - Cuota sindical y proporcional de aguinaldo: sobre la
        //   remuneración real de cada empleado (no se llevan a 40 hs).
        // - Proporcional de aguinaldo mensual = (remunerativo + no
        //   remunerativo del mes) ÷ 12.
        function generarPDFCosteoServicio(empresa, empleadosConLiq, escalaGeneral) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: "mm", format: "a4", orientation: "landscape" });

            const left = 14, right = 283;
            const colEmp = left;
            const colNeto = 120, colSS = 153, colART = 186, colSind = 219, colAgui = 252, colSub = right;
            const rowH = 8;
            const topMargin = 18;
            const pageBottom = 192; // A4 landscape: 210mm de alto, con margen
            let periodoRef = "";

            // Horas mensuales tomadas como base fija para aportes,
            // contribuciones y ART (seguridad social), sin importar la
            // jornada real del empleado (200 hs/mes en jornada completa,
            // 100 hs/mes en media jornada, etc. — siempre se usan estas 40).
            const HORAS_BASE_SS = 100;
            const ART_PCT = 0.052;
            // La cuota sindical, en cambio, se calcula considerando a todos
            // los empleados como si fueran de media jornada (100 hs/mes),
            // sin importar su jornada real.
            const HORAS_BASE_SINDICAL = 200;

            const filas = empleadosConLiq.map(({ emp, liq }) => {
                const calc = calcularLiquidacion(emp, liq, escalaGeneral);
                if (!periodoRef) periodoRef = liq.periodoLabel || liq.periodo || "";

                // Básico y no remunerativo a jornada completa (200 hs/mes),
                // independiente de la jornada real del empleado: si usa la
                // escala general, salen directo de la escala; si están
                // cargados a mano para una jornada reducida, se llevan a
                // jornada completa dividiendo por la fracción de esa jornada.
                const usaEscala = liq.usarEscalaGeneral !== false;
                const basicoJornadaCompleta = usaEscala
                    ? (parseFloat((escalaGeneral.basicos || {})[emp.categoria]) || 0)
                    : (parseFloat(liq.basico) || 0) / (calc.fraccion || 1);
                const noRemunJornadaCompleta = usaEscala
                    ? (parseFloat(escalaGeneral.noRemunerativo) || 0)
                    : (parseFloat(liq.noRemunerativos) || 0) / (calc.fraccion || 1);

                const valorHoraCompleta = basicoJornadaCompleta > 0 ? basicoJornadaCompleta / 200 : 0;
                const valorHoraNoRemunCompleta = noRemunJornadaCompleta > 0 ? noRemunJornadaCompleta / 200 : 0;
                const baseAportesSS = valorHoraCompleta * HORAS_BASE_SS;
                const baseNoRemunSS = valorHoraNoRemunCompleta * HORAS_BASE_SS;

                const contribPatronalesPct = parseFloat(escalaGeneral.contribucionesPatronalesPct) || 0;
                const aportesYContrib = baseAportesSS * 0.11   // jubilación (base 100 hs)
                    + baseAportesSS * 0.03                     // Ley 19.032 (base 100 hs)
                    + calc.obraSocial                          // obra social: igual que en el recibo real
                    + baseAportesSS * contribPatronalesPct / 100; // contribuciones patronales (base 40 hs)

                // ART 5,2%, sobre remunerativo y no remunerativo, ambos
                // proporcionales a la base fija de 40 hs.
                const art = (baseAportesSS + baseNoRemunSS) * ART_PCT;

                // Cuota sindical 4,5%, sobre remunerativo y no remunerativo,
                // ambos proporcionales a la base fija de media jornada
                // (100 hs), para todos los empleados por igual.
                const baseSindicalRemun = valorHoraCompleta * HORAS_BASE_SINDICAL;
                const baseSindicalNoRemun = valorHoraNoRemunCompleta * HORAS_BASE_SINDICAL;
                const sindical = emp.afiliadoSindicato ? (baseSindicalRemun + baseSindicalNoRemun) * 0.045 : 0;

                const aguinaldoProp = (calc.totalRemunerativo + calc.noRemunerativo) / 12;
                const subtotal = calc.neto + aportesYContrib + art + sindical + aguinaldoProp;

                return { nombre: emp.nombre || "(sin nombre)", neto: calc.neto, aportesYContrib, art, sindical, aguinaldoProp, subtotal };
            });

            const sum = (key) => filas.reduce((acc, f) => acc + (f[key] || 0), 0);
            const totalNeto = sum("neto");
            const totalAportes = sum("aportesYContrib");
            const totalART = sum("art");
            const totalSindical = sum("sindical");
            const totalAguinaldo = sum("aguinaldoProp");
            const subtotalCostoLaboral = sum("subtotal");
            const adm = subtotalCostoLaboral * 0.10;
            const baseUtilidad = subtotalCostoLaboral + adm;
            const utilidad = baseUtilidad * 0.3;
            const totalFacturar = baseUtilidad + utilidad;

            let ly = topMargin;

            function dibujarEncabezado() {
                doc.setFont("times", "bold"); doc.setFontSize(14);
                doc.text(empresa.razonSocial || "[Razón Social]", left, ly);
                ly += 6;
                doc.setFont("helvetica", "normal"); doc.setFontSize(9);
                doc.setTextColor(90, 90, 90);
                doc.text(`CUIT: ${empresa.cuit || "-"}`, left, ly);
                ly += 5;
                doc.setFont("helvetica", "bold"); doc.setFontSize(11);
                doc.setTextColor(20, 20, 20);
                doc.text(`Costeo del servicio${periodoRef ? " — " + periodoRef : ""}`, left, ly);
                ly += 8;

                doc.setDrawColor(20, 20, 20); doc.setLineWidth(0.3);
                doc.setFont("helvetica", "bold"); doc.setFontSize(8);
                doc.text("EMPLEADO", colEmp, ly);
                doc.text("NETO A COBRAR", colNeto, ly, { align: "right" });
                doc.text("SS + OS", colSS, ly, { align: "right" });
                doc.text("ART (5,2%)", colART, ly, { align: "right" });
                doc.text("SINDICAL", colSind, ly, { align: "right" });
                doc.text("PROP. AGUINALDO", colAgui, ly, { align: "right" });
                doc.text("SUBTOTAL", colSub, ly, { align: "right" });
                ly += 2;
                doc.line(left, ly, right, ly);
                ly += 6;
                doc.setFont("helvetica", "normal"); doc.setFontSize(9);
            }

            dibujarEncabezado();

            filas.forEach((f, idx) => {
                if (ly > pageBottom) {
                    doc.addPage();
                    ly = topMargin;
                    dibujarEncabezado();
                }
                if (idx % 2 === 1) {
                    doc.setFillColor(245, 244, 238);
                    doc.rect(left - 2, ly - 5.5, (right - left) + 4, rowH, "F");
                }
                doc.setTextColor(20, 20, 20);
                doc.text(f.nombre, colEmp, ly);
                doc.text("$ " + fmt(f.neto), colNeto, ly, { align: "right" });
                doc.text("$ " + fmt(f.aportesYContrib), colSS, ly, { align: "right" });
                doc.text("$ " + fmt(f.art), colART, ly, { align: "right" });
                doc.text("$ " + fmt(f.sindical), colSind, ly, { align: "right" });
                doc.text("$ " + fmt(f.aguinaldoProp), colAgui, ly, { align: "right" });
                doc.setFont("helvetica", "bold");
                doc.text("$ " + fmt(f.subtotal), colSub, ly, { align: "right" });
                doc.setFont("helvetica", "normal");
                ly += rowH;
            });

            // -------- Fila de totales por columna --------
            if (ly > pageBottom - rowH) {
                doc.addPage();
                ly = topMargin;
                dibujarEncabezado();
            }
            doc.setDrawColor(20, 20, 20); doc.setLineWidth(0.4);
            doc.line(left, ly - 4, right, ly - 4);
            doc.setFont("helvetica", "bold"); doc.setFontSize(9);
            doc.text("TOTALES", colEmp, ly);
            doc.text("$ " + fmt(totalNeto), colNeto, ly, { align: "right" });
            doc.text("$ " + fmt(totalAportes), colSS, ly, { align: "right" });
            doc.text("$ " + fmt(totalART), colART, ly, { align: "right" });
            doc.text("$ " + fmt(totalSindical), colSind, ly, { align: "right" });
            doc.text("$ " + fmt(totalAguinaldo), colAgui, ly, { align: "right" });
            doc.text("$ " + fmt(subtotalCostoLaboral), colSub, ly, { align: "right" });
            ly += 14;

            // -------- Resumen de facturación (utilidad + impuestos) --------
            if (ly > pageBottom - 45) {
                doc.addPage();
                ly = topMargin;
            }
            const boxLeft = right - 95;
            doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
            const resumenRow = (label, value, bold, big) => {
                doc.setFont("helvetica", bold ? "bold" : "normal");
                doc.setFontSize(big ? 11.5 : 9.5);
                doc.text(label, boxLeft, ly);
                doc.text("$ " + fmt(value), right, ly, { align: "right" });
                ly += big ? 7.5 : 6.5;
            };
            resumenRow("Subtotal costo laboral", subtotalCostoLaboral, false, false);
            resumenRow("ADMINISTRACION", adm, false, false);
            resumenRow("Base imponible", baseUtilidad, false, false);
            resumenRow("Utilidad", utilidad, false, false);
            doc.setDrawColor(20, 20, 20); doc.setLineWidth(0.4);
            doc.line(boxLeft, ly - 4.5, right, ly - 4.5);
            resumenRow("TOTAL A FACTURAR", totalFacturar, true, true);

            // -------- Aclaración de criterio --------
            ly += 6;
            if (ly > pageBottom + 10) { doc.addPage(); ly = topMargin; }
            doc.setFont("helvetica", "italic"); doc.setFontSize(7);
            doc.setTextColor(120, 120, 120);
            const nota = "Jubilación (11%), Ley 19.032 (3%), ART (5,2%) y contribuciones patronales calculados sobre una base fija de 40 horas mensuales por empleado (valor hora de su categoría a jornada completa, tanto para el concepto remunerativo como el no remunerativo), sin importar su jornada real. Cuota sindical (4,5%, solo afiliados) calculada sobre una base fija de media jornada (100 hs mensuales), también sin importar la jornada real. Obra social calculada igual que en el recibo mensual real de cada empleado (con el regrosamiento por jornada reducida cuando corresponde). Proporcional de aguinaldo (remunerativo + no remunerativo del mes ÷ 12) calculado sobre la remuneración real de cada empleado.";
            const notaLineas = doc.splitTextToSize(nota, right - left);
            doc.text(notaLineas, left, ly);
            doc.setTextColor(20, 20, 20);

            const nombreArchivo = `CosteoServicio_${(empresa.razonSocial || "empresa").replace(/\s+/g, "_")}_${periodoRef.replace(/\s+/g, "_") || "periodo"}.pdf`;
            doc.save(nombreArchivo);
        }

        function App() {
            const [empresa, setEmpresa] = useState({
                razonSocial: "Servicios de Limpieza Ambar SAS",
                cuit: "30-71601678-8",
                domicilio: "Maciel 130 - OF 8",

            const [empleados, setEmpleados] = useState([]);

            const [liqPorEmpleado, setLiqPorEmpleado] = useState({});

            const [periodoGeneral, setPeriodoGeneral] = useState(defaultPeriodoGeneral());
            const [vista, setVista] = useState("empleado"); // "empleado" | "escala" | "webhook"
            const [webhookUrl, setWebhookUrl] = useState("");
            const [webhookEnviando, setWebhookEnviando] = useState(false);
            const [webhookLog, setWebhookLog] = useState([]);
            const [toast, setToast] = useState(null);
            const fileInputRef = useRef(null);

            const emp = empleados.find(e => e.id === selectedId) || null;
            const liq = emp ? (liqPorEmpleado[emp.id] || defaultLiq()) : defaultLiq();
            const liqResuelto = useMemo(() => resolverLiq(liq, periodoGeneral), [liq, periodoGeneral]);

            const calc = useMemo(() => emp
                ? calcularLiquidacion(emp, liqResuelto, escalaGeneral)
                : calcularLiquidacion({}, defaultLiq(), escalaGeneral),
                [emp, liqResuelto, escalaGeneral]);

            function mostrarToast(msg) {
                setToast(msg);
                setTimeout(() => setToast(null), 2600);
            }

                const nuevo = {
                    id: uid(), nombre: "", cuil: "", legajo: "", categoria: "", fechaIngreso: "",
                    domicilio: "", afiliadoSindicato: false, jornada: "COMPLETA"
                };
                setEmpleados([...empleados, nuevo]);
                setSelectedId(nuevo.id);
                setTab("datos");
                setVista("empleado");
            }

                setEmpleados(empleados.map(e => e.id === emp.id ? { ...e, ...patch } : e));
            }

            function updateLiq(patch) {
                setLiqPorEmpleado({ ...liqPorEmpleado, [emp.id]: { ...liq, ...patch } });
            }

                setEscalaGeneral({ ...escalaGeneral, ...patch });
            }

                setPeriodoGeneral({ ...periodoGeneral, ...patch });
            }

                if (!confirm("¿Eliminar este empleado y su liquidación cargada?")) return;
                setEmpleados(empleados.filter(e => e.id !== id));
                if (selectedId === id) setSelectedId(null);
            }

                    mostrarToast("Completá al menos nombre, categoría/período o sueldo básico antes de emitir el recibo.");
                    return;

                generarPDF(empresa, emp, liqResuelto, calc);
                mostrarToast("Recibo generado y descargado ✓");
            }
